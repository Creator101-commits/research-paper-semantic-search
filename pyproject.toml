[project]
name = "research-paper-semantic-search"
version = "0.1.0"
description = "A reproducible SciFact scientific paper retrieval benchmark comparing BM25, dense, hybrid, and rerankers."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sreeharsha Kannegundla" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.1",
    "pyarrow>=17.0",
    "typer>=0.12",
]

[project.optional-dependencies]
neural = [
    "sentence-transformers>=3.0",
    "faiss-cpu>=1.8",
    "huggingface_hub>=0.26",
]

[project.scripts]
paper-search = "paper_search.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "paper_search"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=paper_search --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
